<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bleach vs Naruto v2.4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background effect */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(72, 149, 239, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 195, 113, 0.1) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            animation: fadeIn 1s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: slideDown 0.8s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .title {
            font-family: 'Bangers', cursive;
            font-size: clamp(2.5rem, 8vw, 5rem);
            color: #fff;
            text-shadow: 
                0 0 20px rgba(255, 107, 107, 0.8),
                0 0 40px rgba(72, 149, 239, 0.6),
                3px 3px 0 rgba(0, 0, 0, 0.3);
            letter-spacing: 3px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4895ef, #ffc371);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        
        .subtitle {
            font-size: clamp(1rem, 2vw, 1.3rem);
            color: #a0a0a0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .game-container {
            background: rgba(20, 20, 40, 0.7);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            animation: fadeInScale 1s ease-out 0.3s both;
            position: relative;
        }
        
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .game-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6b6b, #4895ef, #ffc371, #ff6b6b);
            border-radius: 20px;
            z-index: -1;
            opacity: 0;
            animation: borderGlow 3s ease-in-out infinite;
        }
        
        @keyframes borderGlow {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.6; }
        }
        
        #game-wrapper {
            width: 100%;
            aspect-ratio: 4/3;
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        #ruffle-container {
            width: 100%;
            height: 100%;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            z-index: 10;
            animation: blink 1.5s ease-in-out infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .controls-info {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 1.2s ease-out 0.6s both;
        }
        
        .controls-title {
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            color: #ffc371;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(255, 195, 113, 0.5);
        }
        
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .control-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #4895ef;
            transition: all 0.3s ease;
        }
        
        .control-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-left-color: #ff6b6b;
            transform: translateX(5px);
        }
        
        .control-label {
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .control-keys {
            color: #a0a0a0;
            font-size: 0.85rem;
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            animation: fadeIn 1.5s ease-out 0.9s both;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .game-container {
                padding: 15px;
            }
            
            .controls-grid {
                grid-template-columns: 1fr;
            }
            
            body {
                padding: 10px;
            }
        }
        
        /* Fullscreen button */
        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(72, 149, 239, 0.9);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Noto Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            z-index: 100;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .fullscreen-btn:hover {
            background: rgba(255, 107, 107, 0.9);
            transform: scale(1.05);
        }
        
        .fullscreen-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">BLEACH VS NARUTO</h1>
            <p class="subtitle">Version 2.4</p>
        </div>
        
        <div class="game-container">
            <div id="game-wrapper">
                <div class="loading" id="loading">Loading Game...</div>
                <button class="fullscreen-btn" id="fullscreen-btn" style="display: none;">Fullscreen</button>
                <div id="ruffle-container"></div>
            </div>
        </div>
        
        <div class="controls-info">
            <h3 class="controls-title">Game Controls</h3>
            <div class="controls-grid">
                <div class="control-item">
                    <div class="control-label">Movement</div>
                    <div class="control-keys">Arrow Keys / WASD</div>
                </div>
                <div class="control-item">
                    <div class="control-label">Attack</div>
                    <div class="control-keys">J / U / I / K</div>
                </div>
                <div class="control-item">
                    <div class="control-label">Player 2</div>
                    <div class="control-keys">Check in-game menu</div>
                </div>
                <div class="control-item">
                    <div class="control-label">Special Moves</div>
                    <div class="control-keys">Combo attacks</div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            Powered by Ruffle Flash Emulator | Best experienced on desktop
        </div>
    </div>
    
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "allowScriptAccess": true,
            "autoplay": "on",
            "backgroundColor": "#000000",
            "letterbox": "on",
            "unmuteOverlay": "hidden",
            "logLevel": "error",
            "quality": "high",
            "scale": "showAll"
        };
        
        window.addEventListener("load", function() {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            const loading = document.getElementById("loading");
            const fullscreenBtn = document.getElementById("fullscreen-btn");
            const gameWrapper = document.getElementById("game-wrapper");
            
            container.appendChild(player);
            
            // Load the SWF file
            player.load({
                url: "bleach-vs-naruto-v2-4.swf",
                allowScriptAccess: true,
                parameters: "",
            }).then(() => {
                // Hide loading message when game loads
                setTimeout(() => {
                    loading.style.display = 'none';
                    fullscreenBtn.style.display = 'block';
                }, 1000);
            }).catch(error => {
                loading.textContent = "Error loading game. Please refresh the page.";
                console.error("Failed to load SWF:", error);
            });
            
            // Fullscreen functionality
            fullscreenBtn.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    gameWrapper.requestFullscreen().catch(err => {
                        console.log(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            });
            
            // Update button text based on fullscreen state
            document.addEventListener('fullscreenchange', function() {
                if (document.fullscreenElement) {
                    fullscreenBtn.textContent = 'Exit Fullscreen';
                } else {
                    fullscreenBtn.textContent = 'Fullscreen';
                }
            });
        });
    </script>
</body>
</html>
